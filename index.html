            </div>
            <div class="field"><label>Identificación</label><input type="text" id="p_identificacion" value="${Util.esc(p.identificacion)}" disabled></div>
            <div class="field full"><label>Dirección</label><input type="text" id="p_direccion" value="${Util.esc(p.direccion)}" disabled></div>
            <div class="field"><label>Teléfono</label><input type="text" id="p_telefono" value="${Util.esc(p.telefono)}" disabled></div>
          </div>
          ${extraFields}
          <div class="divider"></div>
          <div class="section-title">Productos</div>
          <div class="table-wrap" id="itemsTableWrap">${itemsTableHtml()}</div>
          ${config.simpleItems ? '' : totalsHtml()}
          <div class="divider"></div>
          <div class="form-grid">
            <div class="field full"><label>${config.docType === 'GR' ? 'Información adicional' : 'Observaciones'}</label><textarea id="f_observaciones" placeholder="${config.docType === 'GR' ? 'Ej: N.° de pedido, orden de compra relacionada, RUC del proveedor, referencias internas...' : ''}">${Util.esc(draft.observaciones)}</textarea></div>
          </div>
          <div class="divider"></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-primary" id="saveDocBtn">Guardar ${config.singular.toLowerCase()}</button>
            <button class="btn" id="previewDocBtn" type="button">Vista previa del documento</button>
            <button class="btn" id="cancelDocBtn">Cancelar</button>
          </div>
        </div>
      </div>`;
  }

  /* Muestra, dentro de un modal, cómo quedará el documento generado
     (mismo formato que el PDF final) usando los datos capturados hasta
     el momento en el formulario, sin necesidad de guardar primero. */
  function openPreview(){
    collectFormIntoDraft();
    const previewDraft = draft.numero ? draft : Object.assign({}, draft, { numero: config.prefix + '-PENDIENTE' });
    Modal.open({
      title: `Vista previa · ${config.singular}`,
      bodyHtml: `<div class="preview-frame">${buildPrintHtml(previewDraft)}</div>`,
      footHtml: `
        <button class="btn" data-action="modal-close">Cerrar</button>
        <button class="btn" id="previewDownloadBtn">Descargar PDF</button>
        <button class="btn btn-primary" id="previewPrintBtn">Imprimir</button>`
    });
    document.getElementById('previewPrintBtn').addEventListener('click', ()=> printDocObj(previewDraft));
    document.getElementById('previewDownloadBtn').addEventListener('click', ()=> downloadDocPdf(previewDraft));
  }

  function bindPartySearch(){
    const input = document.getElementById('partySearch');
    const list = document.getElementById('partyAcList');
    const catalogModule = config.partyRole === 'proveedor' ? ProveedoresModule : ClientesModule;
    const fetchFn = config.partyRole === 'proveedor' ? searchProveedores : searchClientes;

    function applyParty(c){
      draft.partyId = c.id;
      draft.partySnapshot = { razonSocial:c.razonSocial, identificacion:c.identificacion, direccion:c.direccion, telefono:c.telefono, ciudad:c.ciudad };
      input.value = `${c.razonSocial} — ${c.identificacion}`;
      document.getElementById('p_identificacion').value = c.identificacion||'';
      document.getElementById('p_direccion').value = c.direccion||'';
      document.getElementById('p_telefono').value = c.telefono||'';
    }

    Autocomplete.attach({
      inputEl: input, listEl: list,
      fetchFn,
      renderItemFn: (c)=> `<div class="t1">${Util.esc(c.razonSocial)}</div><div class="t2">${Util.esc(c.tipoIdentificacion)} ${Util.esc(c.identificacion)} · ${Util.esc(c.telefono||'')}</div>`,
      onSelect: applyParty
    });

    document.getElementById('newPartyBtn').addEventListener('click', ()=>{
      const typed = input.value.trim();
      catalogModule.openForm(null, (record)=>{ applyParty(record); }, typed ? {razonSocial: typed} : null);
    });
  }

  function bindVendedorSearch(){
    const input = document.getElementById('vendedorSearch');
    if(!input) return; // solo aplica a Proformas
    const list = document.getElementById('vendedorAcList');
    const btn = document.getElementById('newVendedorBtn');
    const chk = document.getElementById('sinVendedorChk');

    function applyVendedor(v){
      draft.vendedorId = v.id;
      draft.vendedorSnapshot = { nombre: v.nombre };
      input.value = v.nombre;
    }

    Autocomplete.attach({
      inputEl: input, listEl: list,
      fetchFn: searchVendedores,
      renderItemFn: (v)=> `<div class="t1">${Util.esc(v.nombre)}</div><div class="t2">${Util.esc(v.telefono||'')}</div>`,
      onSelect: applyVendedor
    });

    btn.addEventListener('click', ()=>{
      const typed = input.value.trim();
      VendedoresModule.openForm(null, (record)=>{ applyVendedor(record); }, typed ? {nombre: typed} : null);
    });

    chk.addEventListener('change', (e)=>{
      draft.sinVendedor = e.target.checked;
      if(draft.sinVendedor){
        draft.vendedorId = null;
        draft.vendedorSnapshot = {};
        input.value = '';
        input.disabled = true;
        btn.disabled = true;
      }else{
        input.disabled = false;
        btn.disabled = false;
      }
    });
  }

  function bindTransportistaSearch(){
    const input = document.getElementById('transportistaSearch');
    if(!input) return; // solo aplica a Guías de Remisión
    const list = document.getElementById('transportistaAcList');
    const btn = document.getElementById('newTransportistaBtn');

    function applyTransportista(t){
      draft.transportistaId = t.id;
      draft.transportistaSnapshot = { nombre: t.nombre, identificacion: t.identificacion, tipoIdentificacion: t.tipoIdentificacion, placa: t.placa };
      draft.vehiculo = t.vehiculo || draft.vehiculo;
      draft.placa = t.placa || draft.placa;
      input.value = `${t.nombre} — ${t.placa||''}`;
      document.getElementById('t_identificacion').value = t.identificacion||'';
      document.getElementById('f_placa').value = draft.placa||'';
    }

    Autocomplete.attach({
      inputEl: input, listEl: list,
      fetchFn: searchTransportistas,
      renderItemFn: (t)=> `<div class="t1">${Util.esc(t.nombre)}</div><div class="t2">${Util.esc(t.placa||'')} · ${Util.esc(t.vehiculo||'')}</div>`,
      onSelect: applyTransportista
    });

    btn.addEventListener('click', ()=>{
      const typed = input.value.trim();
      TransportistasModule.openForm(null, (record)=>{ applyTransportista(record); }, typed ? {nombre: typed} : null);
    });
  }

  function collectFormIntoDraft(){
    draft.fecha = document.getElementById('f_fecha').value;
    const venc = document.getElementById('f_vencimiento');
    if(venc) draft.vencimiento = venc.value;
    const formaPago = document.getElementById('f_formaPago');
    if(formaPago) draft.formaPago = formaPago.value;
    const chk = document.getElementById('sinVendedorChk');
    if(chk) draft.sinVendedor = chk.checked;
    draft.observaciones = document.getElementById('f_observaciones').value.trim();
    if(config.docType === 'GR'){
      draft.placa = document.getElementById('f_placa').value.trim();
      draft.fechaInicioTraslado = document.getElementById('f_fechaInicioTraslado').value;
      draft.fechaFinTraslado = document.getElementById('f_fechaFinTraslado').value;
      draft.puntoPartida = document.getElementById('f_puntoPartida').value.trim();
      draft.puntoLlegada = document.getElementById('f_puntoLlegada').value.trim();
      draft.motivoTraslado = document.getElementById('f_motivoTraslado').value.trim();
      draft.documentoAduanero = document.getElementById('f_documentoAduanero').value.trim();
      draft.codigoEstablecimientoDestino = document.getElementById('f_codigoEstablecimientoDestino').value.trim();
      draft.ruta = document.getElementById('f_ruta').value.trim();
    }
  }

  function mountForm(root){
    root.innerHTML = renderForm();
    bindPartySearch();
    bindVendedorSearch();
    bindTransportistaSearch();
    draft.items.forEach((_,i)=>bindItemRow(i));
    document.getElementById('addLineBtn').addEventListener('click', ()=>{
      draft.items.push({ productoId:null, codigo:'', _label:'', cantidad:1, unidad:'', precio:0, descuento:0, iva: config.hasIVA?'15':'0' });
      rerenderItems();
    });
    document.getElementById('cancelDocBtn').addEventListener('click', ()=> App.navigate(config.viewKey));
    document.getElementById('previewDocBtn').addEventListener('click', ()=> openPreview());
    document.getElementById('saveDocBtn').addEventListener('click', async ()=>{
      collectFormIntoDraft();
      if(!draft.partyId){ Toast.show(`Seleccione un ${config.partyRole} del catálogo`, 'err'); return; }
      if(config.docType === 'GR' && !draft.transportistaId){ Toast.show('Seleccione un transportista del catálogo', 'err'); return; }
      if(draft.items.length === 0){ Toast.show('Agregue al menos un producto', 'err'); return; }
      const invalidItem = draft.items.find(it=>!it.productoId || Number(it.cantidad)<=0);
      if(invalidItem){ Toast.show('Revise las líneas de producto: cantidad y producto son obligatorios', 'err'); return; }
      if(!draft.numero){
        if(typeof Sync!=='undefined') await Sync.pullSeq();
        draft.numero = DB.nextSequence(config.docType, config.prefix);
        draft.estado = 'emitido';
      }
      DB.upsert(config.col, draft);
      Toast.show(`${config.singular} ${draft.numero} guardado correctamente`, 'ok');
      App.navigate(config.viewKey);
    });
  }

  /* ---------- PLANTILLA DE IMPRESIÓN ---------- */
  function buildPrintHtml(doc){
    const emp = DB.empresa();
    const t = computeTotals(doc);
    const partyLabel = config.partyRole === 'proveedor' ? 'Proveedor' : 'Cliente';
    const p = doc.partySnapshot || {};
    const tr = doc.transportistaSnapshot || {};
    const unitOf = it => {
      let u = String(it.unidad||'').trim();
      if(!u && it.productoId){
        const pr = DB.getById(config.partyRole === 'proveedor' ? 'productosCompra' : 'productosVenta', it.productoId);
        u = (pr && pr.unidad) ? String(pr.unidad).trim() : '';
      }
      return u || 'UND';
    };
    const rows = doc.items.map((it,i)=>{
      const bruto = (Number(it.cantidad)||0)*(Number(it.precio)||0);
      const desc = bruto*((Number(it.descuento)||0)/100);
      const neto = bruto-desc;
      const nombre = Util.esc(it._label ? it._label.split(' — ').slice(1).join(' — ') || it._label : '');
      if(config.simpleItems){
        return `<tr>
          <td>${Util.esc(it.codigo)}</td>
          <td class="n">${Util.esc(it.cantidad)}</td>
          <td class="c">${Util.esc(unitOf(it))}</td>
          <td>${nombre}</td>
        </tr>`;
      }
      return `<tr>
        <td>${Util.esc(it.codigo)}</td>
        <td>${nombre}</td>
        <td class="n">${Util.esc(it.cantidad)}</td>
        <td class="c">${Util.esc(unitOf(it))}</td>
        <td class="n">$${Util.money(it.precio)}</td>
        <td class="n">${Util.esc(it.descuento||0)}%</td>
        ${config.hasIVA?`<td class="n">${Util.esc(it.iva)}%</td>`:''}
        <td class="n">$${Util.money(neto)}</td>
      </tr>`;
    }).join('');

    // Notas legales por tipo de documento (actualmente sin uso: el cliente
    // solicitó no mostrar avisos legales en ningún tipo de documento).
    const legalNotes = {};

    // Fila etiqueta/valor. Si opt=true, la fila se omite por completo cuando
    // no hay valor (para no llenar el documento con campos vacíos).
    function kv(label, value, opt){
      if(opt && !value) return '';
      return `<div class="dp-row"><span class="k">${label}</span><span class="v">${value || '—'}</span></div>`;
    }

    const clienteBlock = config.docType === 'GR' ? `
      <div class="dp-box">
        <div class="dp-box-title">Cliente / Destinatario</div>
        <div class="dp-box-rows">
          ${kv('Razón social', Util.esc(p.razonSocial))}
          ${kv('Identificación', Util.esc(p.identificacion))}
          ${kv('Dirección', Util.esc(p.direccion))}
          ${kv('Teléfono', Util.esc(p.telefono))}
        </div>
      </div>` : '';

    const transporteBlock = config.docType === 'GR' ? `
      <div class="dp-box">
        <div class="dp-box-title">Datos del traslado</div>
        <div class="dp-box-rows">
          ${kv('Transportista', Util.esc(tr.nombre) || Util.esc(doc.transportista))}
          ${kv('Identificación', Util.esc(tr.identificacion))}
          ${kv('Placa', Util.esc(doc.placa))}
          ${kv('Fecha inicio traslado', doc.fechaInicioTraslado ? Util.fmtDate(doc.fechaInicioTraslado) : '')}
          ${kv('Fecha fin traslado', doc.fechaFinTraslado ? Util.fmtDate(doc.fechaFinTraslado) : '')}
          ${kv('Punto de partida', Util.esc(doc.puntoPartida))}
          ${kv('Destino', Util.esc(doc.puntoLlegada))}
          ${kv('Motivo', Util.esc(doc.motivoTraslado))}
          ${kv('Ruta', Util.esc(doc.ruta), true)}
          ${kv('Doc. aduanero', Util.esc(doc.documentoAduanero), true)}
          ${kv('Cód. establecimiento destino', Util.esc(doc.codigoEstablecimientoDestino), true)}
        </div>
      </div>` : '';

    const razonSocialTxt = emp.razonSocial || 'Empresa';
    const cnClass = razonSocialTxt.length > 48 ? 'cn cn-compact-sm'
                   : razonSocialTxt.length > 30 ? 'cn cn-compact'
                   : 'cn';

    return `<div class="doc-print">
      <div class="dp-head">
        <div class="dp-company">
          ${emp.logo ? `<img src="${emp.logo}">` : ''}
          <div>
            <div class="${cnClass}">${Util.esc(razonSocialTxt)}</div>
            <div class="cd">${Util.esc(emp.nombreComercial||'')}<br>
              RUC: ${Util.esc(emp.ruc||'—')}<br>
              ${Util.esc(emp.direccion||'')}${emp.ciudad?', '+Util.esc(emp.ciudad):''}<br>
              ${emp.telefono?'Tel: '+Util.esc(emp.telefono)+' · ':''}${Util.esc(emp.correo||'')}
            </div>
          </div>
        </div>
        <div class="dp-doc">
          <div class="t">${config.plural}</div>
          <div class="n">${Util.esc(doc.numero)}</div>
          <div class="f">
            Emisión: <b>${Util.fmtDate(doc.fecha)}</b>
            ${config.docType === 'PRF' && doc.vencimiento ? `<br>Vence: <b>${Util.fmtDate(doc.vencimiento)}</b>` : ''}
            ${config.docType !== 'GR' ? `<br>Forma de pago: <b>${Util.esc(doc.formaPago)||'Contado'}</b>` : ''}
            ${config.docType !== 'GR' ? `<br>Moneda: <b>USD</b>` : ''}
          </div>
        </div>
      </div>

      ${config.docType !== 'GR' ? `<div class="dp-grid2">
        <div>
          <div class="dp-label">${partyLabel}</div>
          <div class="dp-val"><strong>${Util.esc(p.razonSocial)||'—'}</strong></div>
          <div class="dp-label">Identificación</div>
          <div class="dp-val">${Util.esc(p.identificacion)||'—'}</div>
        </div>
        <div>
          <div class="dp-label">Dirección</div>
          <div class="dp-val">${Util.esc(p.direccion)||'—'}</div>
          <div class="dp-label">Teléfono</div>
          <div class="dp-val">${Util.esc(p.telefono)||'—'}</div>
          ${doc.vendedorSnapshot?.nombre?`<div class="dp-label">Vendedor</div><div class="dp-val">${Util.esc(doc.vendedorSnapshot.nombre)}</div>`:''}
        </div>
      </div>` : ''}
      ${clienteBlock}
      ${transporteBlock}

      <table class="dp-table">
        ${config.simpleItems ? `<colgroup><col style="width:18%"><col style="width:12%"><col style="width:14%"><col style="width:56%"></colgroup>` : ''}
        <thead><tr>${config.simpleItems ?
          `<th>Código</th><th class="n">Cant.</th><th class="c">Unidad</th><th>Descripción</th>` :
          `<th>Código</th><th>Descripción</th><th class="n">Cant.</th><th class="c">Unidad</th><th class="n">${config.hasCosts?'Costo':'Precio'}</th><th class="n">Desc.</th>${config.hasIVA?'<th class="n">IVA</th>':''}<th class="n">Subtotal</th>`
        }</tr></thead>
        <tbody>${rows}</tbody>
      </table>

      ${(config.docType !== 'GR' && !config.simpleItems) ? `<div class="dp-totals">
        <div class="r"><span>Subtotal</span><span>$${Util.money(t.subtotal)}</span></div>
        <div class="r"><span>Descuento</span><span>-$${Util.money(t.descuentoTotal)}</span></div>
        ${config.hasIVA?`<div class="r"><span>IVA</span><span>$${Util.money(t.ivaTotal)}</span></div>`:''}
        <div class="r g"><span>TOTAL</span><span>$${Util.money(t.total)}</span></div>
        <div class="dp-letras"><span>Son:</span> ${Util.montoEnLetras(t.total)}</div>
      </div>` : ''}

      ${doc.observaciones ? (config.docType === 'GR'
        ? `<div class="dp-box"><div class="dp-box-title">Información adicional</div><div style="font-size:11px;color:#333;white-space:pre-line;padding:2px 0 6px;text-transform:uppercase;">${Util.esc(doc.observaciones)}</div></div>`
        : `<div class="dp-obs"><strong>Observaciones:</strong> ${Util.esc(doc.observaciones)}</div>`
      ) : ''}

      ${legalNotes[config.docType] ? `<div class="dp-legal">${legalNotes[config.docType]}</div>` : ''}

      <div class="dp-bottom">
        ${signBlockHtml(config.docType)}
        <div class="dp-foot">
          <span>${Util.esc(emp.razonSocial||'')} · RUC ${Util.esc(emp.ruc||'')}</span>
          <span>Generado con FINTELLIX ONE</span>
        </div>
      </div>
    </div>`;
  }

  /* Firmas al pie del documento, según el tipo:
     - Proforma (PRF): sin firmas, solo el pie de página.
     - Orden de Compra (OC): Elaborado por / Autorizado por / Recibí conforme.
     - Guía de Remisión (GR): únicamente Recibí conforme. */
  function signBlockHtml(docType){
    if(docType === 'OC'){
      return `<div class="dp-sign">
        <div>Elaborado por</div>
        <div>Autorizado por</div>
        <div>Recibí conforme</div>
      </div>`;
    }
    if(docType === 'GR'){
      return `<div class="dp-sign dp-sign-1">
        <div>Recibí conforme</div>
      </div>`;
    }
    return '';
  }

  /* ---------- GENERACIÓN DE PDF (motor headless, sin diálogo nativo) ---------- */

  // Nombre sugerido: "NombreCliente_TipoDocumento_Numero"
  function suggestedFileName(doc){
    const partyName = (doc.partySnapshot && doc.partySnapshot.razonSocial) || 'SinNombre';
    const tipo = config.singular.replace(/\s+/g, '');
    const numero = doc.numero || (config.prefix + '-BORRADOR');
    const clean = (s)=> String(s)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quitar tildes
      .replace(/[\\/:*?"<>|]+/g, '-')
      .replace(/\s+/g, ' ')
      .trim();
    return `${clean(partyName)}_${clean(tipo)}_${clean(numero)}`;
  }

  // Arma un documento HTML independiente (con los mismos estilos de la app)
  // que contiene únicamente la plantilla imprimible del documento.
  // - No depende de internet: la tipografía (Inter) va incrustada en base64,
  //   así el PDF se ve siempre con el mismo tipo de letra profesional, sin
  //   importar si el equipo tiene o no esa fuente instalada.
  // - Fuerza la visibilidad del contenido explícitamente, sin depender del
  //   truco de "@media print" (que solo se activa dentro de un diálogo de
  //   impresión real y no siempre aplica al generar el PDF en segundo plano).
  function buildStandaloneDocHtml(doc){
    const styleEl = document.head.querySelector('style');
    const styleHtml = styleEl ? styleEl.outerHTML : '';
    const titleText = Util.esc(`${config.singular} ${doc.numero||''}`.trim());
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titleText}</title>
      ${styleHtml}
      <style>${PRINT_FONT_CSS}</style>
      <style>
        html,body{margin:0;padding:0;background:#fff;}
        #printArea{display:block !important;}
        #printArea, #printArea *{visibility:visible !important;}
        /* Una sola tipografía profesional en todo el documento impreso */
        #printArea, #printArea *{font-family:'Inter','Segoe UI',Arial,sans-serif !important;}
      </style>
      </head>
      <body><div id="printArea">${buildPrintHtml(doc)}</div></body></html>`;
  }

  function shortErr(e){
    const s = String(e || 'Error desconocido');
    return s.length > 160 ? s.slice(0, 160) + '…' : s;
  }

  async function downloadDocPdf(doc){
        Toast.show('Abriendo documento…', 'ok');
    const res = await window.fintellixAPI.downloadPDF({
      html: buildStandaloneDocHtml(doc),
      suggestedName: suggestedFileName(doc)
    });
    if(res.ok) Toast.show('Documento abierto. Use «Guardar como PDF».', 'ok');
    else if(!res.canceled) Toast.show('No se pudo generar el PDF: ' + shortErr(res.error), 'err');
  }

  async function printDoc(id){
    const doc = DB.getById(config.col, id);
    if(!doc) return;
    await printDocObj(doc);
  }

  async function printDocObj(doc){
        Toast.show('Abriendo documento para imprimir…', 'ok');
    const res = await window.fintellixAPI.openPdfForPrint({
      html: buildStandaloneDocHtml(doc),
      suggestedName: suggestedFileName(doc)
    });
    if(!res.ok) Toast.show('No se pudo abrir el PDF: ' + shortErr(res.error), 'err');
  }

  function bindListEvents(container){
    const searchInput = container.querySelector('#docSearch');
    if(searchInput){
      searchInput.addEventListener('input', Util.debounce(()=>{
        container.innerHTML = renderList(searchInput.value);
        bindListEvents(container);
        const si = container.querySelector('#docSearch');
        si.focus(); si.selectionStart = si.value.length;
      }, 180));
    }
    container.querySelectorAll('[data-action="doc-new"]').forEach(b=>b.addEventListener('click', ()=>{
      draft = blankDoc();
      mountForm(container);
    }));
    container.querySelectorAll('[data-action="doc-edit"]').forEach(b=>b.addEventListener('click', ()=>{
      const original = DB.getById(config.col, b.dataset.id);
      draft = JSON.parse(JSON.stringify(original));
      draft.items.forEach(it=>{ if(!it._label && it.codigo) it._label = it.codigo; });
      mountForm(container);
    }));
    container.querySelectorAll('[data-action="doc-dup"]').forEach(b=>b.addEventListener('click', ()=>{
      const original = DB.getById(config.col, b.dataset.id);
      draft = JSON.parse(JSON.stringify(original));
      draft.id = Util.uid();
      draft.numero = null;
      draft.estado = 'borrador';
      draft.fecha = Util.todayISO();
      Toast.show('Documento duplicado. Complete y guarde para asignar número.', 'ok');
      mountForm(container);
    }));
    container.querySelectorAll('[data-action="doc-print"]').forEach(b=>b.addEventListener('click', ()=> printDoc(b.dataset.id)));
    container.querySelectorAll('[data-action="doc-download"]').forEach(b=>b.addEventListener('click', ()=>{
      const doc = DB.getById(config.col, b.dataset.id);
      if(doc) downloadDocPdf(doc);
    }));
    container.querySelectorAll('[data-action="doc-delete"]').forEach(b=>b.addEventListener('click', ()=>{
      Modal.confirmDelete('¿Eliminar este documento? Esta acción no se puede deshacer.', ()=>{
        DB.remove(config.col, b.dataset.id);
        Toast.show('Documento eliminado', 'ok');
        App.renderView();
      });
    }));
  }

  return {
    mount(root){
      draft = null;
      root.innerHTML = renderList('');
      bindListEvents(root);
    }
  };
}

const DashboardModule = {
  mount(root){

    const ocs = DB.all('ordenesCompra');
    const guias = DB.all('guiasRemision');
    const clientes = DB.all('clientes');
    const proveedores = DB.all('proveedores');

    const sumTotal = (docs, hasIVA)=> docs.reduce((acc,d)=>{
      let s=0, iv=0;
      d.items.forEach(it=>{
        const bruto=(Number(it.cantidad)||0)*(Number(it.precio)||0);
        const desc=bruto*((Number(it.descuento)||0)/100);
        const neto=bruto-desc;
        s+=neto;
        if(hasIVA) iv += neto*((Number(it.iva)||0)/100);
      });
      return acc + s + iv;
    }, 0);

    const totalProformas = sumTotal(proformas, true);
    const totalOC = sumTotal(ocs, true);

    root.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="n">${proformas.length}</div><div class="l">Proformas emitidas</div></div>
        <div class="stat-card"><div class="n">${ocs.length}</div><div class="l">Órdenes de compra</div></div>
        <div class="stat-card"><div class="n">${guias.length}</div><div class="l">Guías de remisión</div></div>
        <div class="stat-card"><div class="n">$${Util.money(totalProformas)}</div><div class="l">Total en proformas</div></div>
        <div class="stat-card"><div class="n">$${Util.money(totalOC)}</div><div class="l">Total en órdenes de compra</div></div>
        <div class="stat-card"><div class="n">${clientes.length}</div><div class="l">Clientes registrados</div></div>
        <div class="stat-card"><div class="n">${proveedores.length}</div><div class="l">Proveedores registrados</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Últimas proformas</h2></div>
        <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Estado</th></tr></thead>
          <tbody>
            ${proformas.length===0 ? `<tr class="empty-row"><td colspan="4">Aún no se han creado proformas.</td></tr>` :
              proformas.slice(-6).reverse().map(d=>`<tr>
                <td class="doc-num">${Util.esc(d.numero)}</td>
                <td>${Util.fmtDate(d.fecha)}</td>
                <td>${Util.esc(d.partySnapshot?.razonSocial)||'—'}</td>
                <td><span class="badge ${d.estado==='anulado'?'badge-red':'badge-green'}">${d.estado}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>`;
  }
};

/* ===== CAPA WEB: descargas, PDF y acceso ===== */
const WebIO = {
  async save(filename, data){
    try{
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if(dl){ const r = await dl.save({filename, data}); if(r) { Toast.show('Archivo listo: '+filename,'ok'); return true; } }
    }catch(e){ if(e && e.code==='declined') return false; }
    try{ // fallback navegador normal
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000); Toast.show('Archivo descargado: '+filename,'ok'); return true;
    }catch(e){ Toast.show('No se pudo guardar el archivo','err'); return false; }
  },
  viewDoc(html,name,autoPrint){
    const safe=String(name||'documento').replace(/[<>&"]/g,'');
    const bar='<div id="f1bar"><b>'+safe+'</b><span><button onclick="window.print()">Imprimir / PDF</button><button class="g" onclick="window.close()">Cerrar</button></span></div>';
    const css='<meta name="viewport" content="width=device-width,initial-scale=1"><style>@page{size:A4;margin:14mm}#f1bar{position:fixed;top:0;left:0;right:0;height:48px;background:#0B1B3F;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:600 13px Arial,sans-serif;z-index:99}#f1bar button{background:#0B4AE0;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 13px Arial,sans-serif;cursor:pointer;margin-left:8px}#f1bar button.g{background:transparent;border:1px solid #6B7FA8}#f1bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-size:12px}#f1bar span{display:flex;flex:none}#f1bar button{white-space:nowrap}@media screen{html,body{background:#D9DEE6 !important}body{padding:64px 0 24px !important}#printArea{width:210mm;box-sizing:border-box;margin:0 auto;padding:14mm;background:#fff !important;box-shadow:0 4px 20px rgba(0,0,0,.2)}}@media print{#f1bar{display:none !important}}</style>';
    const base=html.replace(/<title>[\s\S]*?<\/title>/,()=>'<title>'+safe+'</title>').replace('</head>',()=>css+'</head>').replace('<body>',()=>'<body>'+bar);
    let w=null; try{ w=window.open('','_blank'); }catch(e){}
    if(w){
      const fit='<script>(function(){var pa;function fit(){pa=document.getElementById("printArea");var w=document.documentElement.clientWidth;if(w<820){pa.style.zoom=(w/794)*0.98;pa.style.margin="0 auto"}else{pa.style.zoom="";pa.style.margin="0 auto"}}addEventListener("load",fit);addEventListener("resize",fit);addEventListener("beforeprint",function(){pa.style.zoom="";pa.style.margin="0"});addEventListener("afterprint",fit)})()<\/script>';
      const auto=fit+'<script>window.addEventListener("load",function(){setTimeout(function(){window.print()},500)})<\/script>';
      w.document.open(); w.document.write(autoPrint ? base.replace('</body>',()=>auto+'</body>') : base.replace('</body>',()=>fit+'</body>')); w.document.close(); return true;
    }
    try{
      const fr=document.createElement('iframe'); fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
      document.body.appendChild(fr);
      fr.onload=()=>{ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){} setTimeout(()=>fr.remove(),60000); };
      fr.srcdoc=base.replace(/<div id="f1bar">[\s\S]*?<\/div>/,''); return true;
    }catch(e){ return false; }
  }
};

        status('⚠ Sin conexión · usando datos de este equipo',true); return false; } },
    async pullSeq(){ try{ await pull(); }catch(e){} },
    poll(){ if(!on||polling)return; polling=true; setInterval(()=>{ if(!document.hidden) refresh(); },20000);
      document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); }); window.addEventListener('online',refresh); }
  };
})();
(function(){
  const HASH='2c8f0784a62fd2bb83c18b77dd3a746fd29d827de0e051ab4316d2236d26a957';
  async function sha(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let booted=false;
  async function unlock(remember,pw){
    if(remember){ try{ sessionStorage.setItem('f1_auth',HASH); if(pw) sessionStorage.setItem('f1_pw',pw); }catch(e){} }
    if(booted)return; booted=true;
    if(Sync.on){ const b=document.getElementById('gateBtn'); if(b){ b.textContent='Conectando…'; b.disabled=true; }
      await Promise.race([Sync.start(pw),new Promise(r=>setTimeout(r,7000))]); }
    document.body.classList.remove('locked'); const g=document.getElementById('gate'); if(g) g.remove();
    App.init(); Sync.poll();
  }
  async function tryLogin(){
    const v=document.getElementById('gatePass').value;
    let ok=false; try{ ok=(await sha(v))===HASH; }catch(e){ document.getElementById('gateErr').textContent='Este navegador no permite verificar la clave.'; return; }
    if(ok) unlock(true,v); else { document.getElementById('gateErr').textContent='Clave incorrecta'; document.getElementById('gatePass').select(); }
  }
  document.addEventListener('DOMContentLoaded',()=>{
    let saved=null; try{ saved=sessionStorage.getItem('f1_auth'); }catch(e){}
    if(saved===HASH){ let pw=null; try{ pw=sessionStorage.getItem('f1_pw'); }catch(e){} unlock(false,pw); return; }
    document.getElementById('gateBtn').addEventListener('click',tryLogin);
    document.getElementById('gatePass').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });
  });
})();


</script>
