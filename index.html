<title>FINTELLIX ONE — Sistema de Gestión Comercial</title>

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FINTELLIX ONE — DESIGN TOKENS
   ============================================================ */
:root{

  /*==================================================
    IDENTIDAD CORPORATIVA FINTELLIX
  ==================================================*/

  --ink:#00235f;
  --ink-2:#00235f;

  /*==================================================
    PALETA PRINCIPAL DEL SISTEMA
  ==================================================*/

  /* Azul corporativo */
  --primary:#092664;
  --primary-hover:#155EEF;
  --primary-light:#EAF2FF;

  /* Escala de grises */
  --gray:#929A9D;
  --gray-dark:#667085;
  --gray-light:#D9DEE3;
  --gray-bg:#F4F6F8;

  /*==================================================
    SUPERFICIES
  ==================================================*/

  --paper:#F6F7F9;
  --surface:#FFFFFF;

  /*==================================================
    BORDES
  ==================================================*/

  --line:#DFE4EA;
  --line-strong:#C3CBD6;

  /*==================================================
    COLORES DE ESTADO
  ==================================================*/

  --success:#16A34A;
  --success-bg:#EAF7EF;

  --warning:#D97706;
  --warning-bg:#FFF7E8;

  --danger:#DC2626;
  --danger-bg:#FDECEC;

  --info:#175CD3;
  --info-bg:#EAF2FF;

  /*==================================================
    COLORES CORPORATIVOS (SOLO IDENTIDAD)
  ==================================================*/

  --gold:#B8903F;
  --gold-deep:#8F6E2B;

  /*==================================================
    TEXTOS
  ==================================================*/

  --text:#1B2430;
  --text-dim:#5B6674;
  --text-faint:#8C97A6;

  /*==================================================
    DISEÑO
  ==================================================*/

  --radius:8px;
  --radius-sm:5px;
  --radius-md:10px;
  --radius-lg:14px;

  --shadow-sm:0 1px 2px rgba(16,35,61,.06);
  --shadow-md:0 4px 16px rgba(16,35,61,.10);
  --shadow-lg:0 10px 30px rgba(16,35,61,.15);

  /*==================================================
    TIPOGRAFÍA
  ==================================================*/

  --font-display:'Source Serif 4', Georgia, serif;

  --font-body:'Inter',
              -apple-system,
              BlinkMacSystemFont,
              'Segoe UI',
              sans-serif;

  --font-mono:'IBM Plex Mono',
              'Courier New',
              monospace;

}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::selection{background:rgba(184,144,63,.28);}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{
    display:grid;
    grid-template-columns:248px minmax(0,1fr);
    grid-template-rows:1fr auto;
    grid-template-areas:
        "sidebar main"
        "sidebar footer";
    height:100vh;
    overflow:hidden;
    transition:grid-template-columns .25s ease;
    position:relative;
}

#app.sidebar-collapsed{
    grid-template-columns:72px minmax(0,1fr);
}

@media (max-width:880px){
    #app{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr auto;
        grid-template-areas:
            "main"
            "footer";
    }
}
@media (max-width:880px){
  #app{grid-template-columns:1fr;grid-template-areas:"main" "footer";}
}

/* SIDEBAR */
#sidebar{
  grid-area:sidebar;  
  background:linear-gradient(
        180deg,
        #00235f 0%,
        #00235f 100%
    );
    color:#EAF2FF;
    display:flex;
    flex-direction:column;
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
}
#sidebar.collapsed{
    width:100%;
}
/*====================================================
 BOTÓN FLOTANTE DEL SIDEBAR
====================================================*/
.sidebar-toggle{
    position:fixed;
    top:40px;
    left:229px;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid #D0D5DD;
    background:#E5E7EB;
    color:#475467;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.18);
    transition:
        left .25s ease,
        background .20s ease,
        color .20s ease,
        transform .20s ease,
        box-shadow .20s ease;
    z-index:2000;
}

.sidebar-toggle:hover{
    background:#D0D5DD;
    color:#344054;
    transform:scale(1.08);
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}
/*====================================================
 POSICIÓN DEL BOTÓN SEGÚN EL ESTADO DEL MENÚ
====================================================*/
#app:not(.sidebar-collapsed) .sidebar-toggle{
    left:229px;
}
#app.sidebar-collapsed .sidebar-toggle{
    left:53px;
}
.sidebar-toggle:hover{
    background:#D0D5DD;
    transform:scale(1.08);
}
@media (max-width:880px){
  #sidebar{position:fixed;left:0;top:0;width:248px;min-height:100vh;height:100vh;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow-md);}
  #sidebar.open{transform:translateX(0);}
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:22px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.10);
}
.brand-mark{
  width:34px;height:34px;border-radius:7px;
  background:#FFFFFF;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:16px;
  flex:none;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.brand-text{font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:.2px;}
.brand-text small{display:block;font-family:var(--font-mono);font-weight:400;font-size:9.5px;letter-spacing:1.5px;color:#9FB2C9;text-transform:uppercase;margin-top:1px;}

.company-chip{
  margin:14px 16px;padding:10px 12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:9px;
}
.company-chip img{width:26px;height:26px;object-fit:contain;border-radius:4px;background:#fff;}
.company-chip .ph{width:26px;height:26px;border-radius:4px;background:rgba(255,255,255,.12);flex:none;}
.company-chip-text{overflow:hidden;}
.company-chip-text .cn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.company-chip-text .cr{font-size:10.5px;color:#9FB2C9;font-family:var(--font-mono);}

nav.nav{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:6px 12px 12px;
}
.nav-group{margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);}
.nav-group:first-child{margin-top:0;padding-top:0;border-top:none;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#8093AD;padding:0 12px;margin-bottom:10px;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-sm);
  color:#CBD9EA;text-decoration:none;font-size:13.3px;font-weight:500;
  cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;
  transition:background .12s ease, color .12s ease;
}
.nav-item .ic{width:17px;height:17px;flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(184,144,63,.18);color:#fff;box-shadow:inset 2px 0 0 var(--gold);}
/* ===== SIDEBAR COLAPSADO ===== */

#sidebar.collapsed .brand-text{display:none;}
#sidebar.collapsed .company-chip-text{display:none;}
#sidebar.collapsed .nav-label{display:none;}
#sidebar.collapsed .nav-text{display:none;}
#sidebar.collapsed .company-chip{justify-content:center;padding:10px 0;margin:14px 10px;}
#sidebar.collapsed .brand{justify-content:center;padding:18px 0;}
#sidebar.collapsed .nav-item{justify-content:center;align-items:center;padding:12px 0;gap:0;}

/* MAIN */
#main{
    grid-area:main;
    position:relative;
    min-width:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:26px 30px 60px;
    background:var(--paper);
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.topbar-left h1{font-family:var(--font-display);font-size:23px;font-weight:600;margin:0 0 3px;}
.topbar-left .sub{color:var(--text-dim);font-size:12.8px;}
.menu-toggle{display:none;}
@media (max-width:880px){
  .menu-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;cursor:pointer;margin-right:8px;}
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 18px;
  min-height:40px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:
      background .20s ease,
      border-color .20s ease,
      color .20s ease,
      transform .15s ease,
      box-shadow .20s ease;
  white-space:nowrap;
}

.btn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(16,35,61,.08);
}
.btn svg{width:14px;height:14px;}
.btn:hover{border-color:var(--text-faint);background:#FAFBFC;}
.btn-primary{background:var(--primary);border-color:var(--primary);color:white;}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:white;}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#241A06;}
.btn-gold:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;}
.btn-danger{color:var(--red);border-color:var(--red-bg);}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--paper);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-icon{padding:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/*==================================================
  CARDS
==================================================*/

.card{
    background:var(--surface);
    border:1px solid #E4E7EC;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(16,35,61,.05);
    overflow:hidden;
    transition:
        transform .18s ease,
        box-shadow .18s ease;
}
.card:hover{
    box-shadow:0 12px 28px rgba(16,35,61,.08);
}
.card + .card{
    margin-top:24px;
}
.card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:18px 22px;
    background:#FBFCFD;
    border-bottom:1px solid #EDF1F5;
}
.card-head h2{
    margin:0;
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    color:var(--text);
}
.card-body{
    padding:22px;
}

.search-box{position:relative;flex:1;max-width:340px;min-width:180px;}
.search-box input{width:100%;height:40px;padding:0 14px 0 38px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.20s;}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(23,92,211,.12);}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);pointer-events:none;}

/*==================================================
  TABLAS
==================================================*/

.table-wrap{
    overflow-x:auto;
    border:1px solid #E4E7EC;
    border-radius:12px;
    background:#fff;
}

table.tbl{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    font-size:13px;
    background:#fff;
}
table.tbl thead{
    position:sticky;
    top:0;
    z-index:2;
}
table.tbl th{
    padding:13px 14px;
    background:#F8FAFC;
    color:var(--text-dim);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.8px;
    text-align:left;
    border-bottom:1px solid #E4E7EC;
    white-space:nowrap;
    position:sticky;
    top:0;
    z-index:2;
}
table.tbl td{
    padding:13px 14px;
    border-bottom:1px solid #EEF2F6;
    color:var(--text);
    vertical-align:middle;
    transition:background .18s ease;
}
table.tbl tbody tr{
    transition:background .18s ease;
}
table.tbl tbody tr:nth-child(even){
    background:#FCFDFE;
}
table.tbl tbody tr:hover{
    background:var(--primary-light);
}
table.tbl tbody tr:last-child td{
    border-bottom:none;
}
table.tbl .num{
    text-align:right;
    font-family:var(--font-mono);
    font-weight:600;
    white-space:nowrap;
}
table.tbl .center{
    text-align:center;
}
table.tbl .right{
    text-align:right;
}
.empty-row td{
    text-align:center;
    padding:45px 15px;
    color:var(--text-faint);
    font-style:italic;
}
/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea{
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    outline:none;
    color:var(--text);
    width:100%;
    transition:.20s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(23,92,211,.12);}
.field textarea{resize:vertical;min-height:60px;}
.field .hint{font-size:11px;color:var(--text-faint);}
.field input:disabled{background:var(--paper);color:var(--text-dim);}

.divider{height:1px;background:var(--line);margin:18px 0;}
.section-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;margin:0 0 12px;color:var(--ink);display:flex;align-items:center;gap:9px;}
/* Numeración de secciones en formularios largos (aspecto de asistente
   de generación de documentos, paso a paso) */
.card-body{counter-reset:section-step;}
.section-title{counter-increment:section-step;}
.section-title::before{
  content:counter(section-step);
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;border-radius:50%;
  background:var(--primary);color:#fff;
  font-family:var(--font-body);font-size:11px;font-weight:700;
}

/* Autocomplete */
.ac-wrap{position:relative;}
.ac-list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:100;
  background:#fff;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);max-height:260px;overflow-y:auto;
}
.ac-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.hi{background:var(--paper);}
.ac-item .t1{font-weight:600;font-size:13px;}
.ac-item .t2{font-size:11.5px;color:var(--text-dim);font-family:var(--font-mono);}
.ac-empty{padding:12px;color:var(--text-faint);font-size:12.5px;text-align:center;}

/* Line items table (docs) */
.li-table{width:100%;border-collapse:collapse;}
.li-table th{background:var(--paper);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);}
.li-table td{padding:6px 9px;border-bottom:1px solid var(--line);}
.li-table input,.li-table select{padding:6px 8px;font-size:12.8px;border:1px solid var(--line);border-radius:5px;}
.li-table input.num-in{text-align:right;font-family:var(--font-mono);}
.li-table input[readonly]{background:var(--paper);color:var(--text-dim);font-family:var(--font-mono);}
.li-table td.li-unidad{text-align:right;font-family:var(--font-mono);color:var(--text-dim);}
.li-remove{color:var(--red);cursor:pointer;background:none;border:none;padding:5px;border-radius:5px;}
.li-remove:hover{background:var(--red-bg);}

.totals-box{margin-top:14px;margin-left:auto;width:100%;max-width:340px;}
.totals-row{display:flex;justify-content:space-between;padding:6px 2px;font-size:13.3px;}
.totals-row.grand{border-top:1.5px solid var(--ink);margin-top:5px;padding-top:10px;font-weight:700;font-size:16px;font-family:var(--font-display);color:var(--ink);}
.totals-row .lbl{color:var(--text-dim);}
.totals-row.grand .lbl{color:var(--ink);}
.totals-row .val{font-family:var(--font-mono);}

/* Stamp / signature element */
.stamp{
  position:relative;display:inline-flex;flex-direction:column;align-items:flex-end;
  padding:8px 14px;border:1.5px solid var(--gold);border-radius:6px;
  background:repeating-linear-gradient(135deg,rgba(184,144,63,.05) 0 8px,transparent 8px 16px);
}
.stamp .prefix{font-size:9.5px;letter-spacing:2px;color:var(--gold-deep);text-transform:uppercase;font-weight:700;}
.stamp .code{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.5px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(16,35,61,.45);backdrop-filter:blur(1px);
  display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:30px 16px;overflow-y:auto;
}
.modal{background:#fff;border-radius:10px;width:100%;max-width:880px;box-shadow:var(--shadow-md);animation:pop .15s ease;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-family:var(--font-display);font-size:18px;margin:0;font-weight:600;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-dim);padding:6px;border-radius:6px;}
.modal-close:hover{background:var(--paper);}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto;}
.preview-frame{background:#fff;border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-sm);overflow:hidden;}
.preview-frame .doc-print{min-height:0;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
.modal-sm{max-width:460px;}

.toast-wrap{position:fixed;bottom:64px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:7px;font-size:13px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:9px;animation:pop .15s ease;min-width:220px;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

/* Footer */
#footerbar{
  grid-area:footer;background:var(--ink);color:#8FA3BC;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  padding:9px 20px;display:flex;align-items:center;justify-content:space-between;
  border-top:2px solid var(--gold);
}
#footerbar b{color:#D9C48F;font-weight:600;}

/* Dashboard */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);}
.stat-card .n{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--ink);}
.stat-card .l{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* Logo upload */
.logo-drop{
  border:2px dashed var(--line-strong);border-radius:var(--radius);
  display:flex;align-items:center;gap:20px;padding:18px;
}
.logo-drop img{width:160px;height:160px;object-fit:contain;background:var(--paper);border-radius:8px;}
.logo-drop .ph{width:160px;height:160px;background:var(--paper);border-radius:8px;flex:none;}

/* Print area (hidden on screen) */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;}
  @page{margin:14mm;}
}

.doc-print{font-family:var(--font-body);color:#1a1f2b;font-size:12.5px;padding:8mm 7mm;display:flex;flex-direction:column;min-height:238mm;}
.dp-head{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid #10233D;padding-bottom:14px;margin-bottom:18px;}
.dp-company{display:flex;gap:16px;align-items:center;}
.dp-company img{width:64px;height:64px;object-fit:contain;margin-top:2px;}
.dp-company .cn{font-family:var(--font-body);font-size:15.5px;font-weight:800;color:#10233D;letter-spacing:.2px;line-height:1.25;text-transform:uppercase;}
.dp-company .cn.cn-compact{font-size:11.5px;letter-spacing:.05px;line-height:1.3;}
.dp-company .cn.cn-compact-sm{font-size:10px;letter-spacing:0;line-height:1.3;}
.dp-company .cd{font-size:10px;color:#5a6270;line-height:1.65;margin-top:5px;}

/* Recuadro de datos del documento — número, fechas y condiciones */
.dp-doc{text-align:right;border:1px solid #D8DEE8;border-radius:7px;padding:10px 16px;min-width:180px;flex:none;background:#FBFBFC;}
.dp-doc .t{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:#9A7A2F;font-weight:700;}
.dp-doc .n{font-family:var(--font-body);font-size:17px;font-weight:800;color:#10233D;letter-spacing:.3px;margin-top:2px;}
.dp-doc .f{font-size:10px;color:#5a6270;margin-top:6px;line-height:1.7;}
.dp-doc .f b{color:#333;font-weight:600;}

/* Bloques de dos columnas con etiqueta (dorada) sobre valor — cliente/proveedor,
   transportista, destinatario */
.dp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px;}
.dp-section-h{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:#9A7A2F;font-weight:700;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #EDE3CC;}
.dp-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#9A7A2F;font-weight:700;margin-bottom:2px;}
.dp-val{font-size:12px;margin-bottom:8px;color:#1a1f2b;text-transform:uppercase;}

/* Recuadros estructurados de etiqueta / valor (Guía de Remisión) — cada
   recuadro ocupa el ancho completo, con sus filas internas en 2 columnas. */
.dp-box{border:1px solid #C9CFD8;border-radius:6px;padding:12px 16px 6px;margin-bottom:14px;}
.dp-box-title{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:#9A7A2F;font-weight:700;margin:-12px -16px 10px;padding:7px 16px;background:#F8F6F0;border-bottom:1px solid #C9CFD8;border-radius:6px 6px 0 0;}
.dp-box-rows{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
.dp-row{display:flex;flex-direction:column;gap:0;padding:5px 0;font-size:10.8px;}
.dp-row .k{font-size:8.7px;text-transform:uppercase;letter-spacing:.5px;color:#8b93a3;font-weight:700;margin-bottom:1px;}
.dp-row .v{color:#1a1f2b;font-weight:500;text-transform:uppercase;}

table.dp-table{width:100%;border-collapse:collapse;margin-top:2px;}
table.dp-table th{color:#6b7280;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:8px 7px;text-align:left;border-bottom:1.5px solid #10233D;}
table.dp-table td{padding:9px 7px;border-bottom:1px solid #E7EAEF;font-size:11.5px;vertical-align:middle;color:#1a1f2b;text-transform:uppercase;}
table.dp-table tbody tr:last-child td{border-bottom:1px solid #10233D;}
table.dp-table td.n,table.dp-table th.n{text-align:right;}
table.dp-table td.c,table.dp-table th.c{text-align:center;}

.dp-totals{margin-left:auto;width:260px;margin-top:10px;}
.dp-totals .r{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:#444;}
.dp-totals .r.g{border-top:1.5px solid #10233D;margin-top:5px;padding-top:9px;font-weight:700;font-size:15px;color:#10233D;}
.dp-letras{margin-top:10px;padding-top:9px;border-top:1px dashed #D8DEE8;font-size:9.5px;color:#5a6270;line-height:1.5;text-align:right;}
.dp-letras span{font-weight:700;color:#10233D;}

.dp-obs{margin-top:18px;font-size:11px;color:#444;border-top:1px dashed #ccc;padding-top:10px;text-transform:uppercase;}
.dp-legal{margin-top:14px;font-size:8.6px;color:#8b93a3;font-style:italic;line-height:1.55;}

/* Bloque inferior (firmas + pie de página): se ancla siempre al final
   de la hoja, sin importar cuánto contenido tenga el documento arriba. */
.dp-bottom{margin-top:auto;}
.dp-foot{margin-top:28px;display:flex;justify-content:space-between;font-size:9.5px;color:#9299a6;border-top:1px solid #eee;padding-top:9px;}
.dp-sign{margin-top:38px;display:flex;justify-content:space-between;gap:30px;}
.dp-sign div{flex:1;text-align:center;border-top:1px solid #999;padding-top:6px;font-size:10.5px;color:#555;}
.dp-sign.dp-sign-1{justify-content:center;}
.dp-sign.dp-sign-1 div{flex:none;width:280px;}


.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}
.empty-state p{margin:0;font-size:13.5px;}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
select.status-filter{padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;}

.kv-pair{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.kv-pair span:first-child{color:var(--text-dim);}
.kv-pair span:last-child{font-weight:600;}

.confirm-icon{width:42px;height:42px;border-radius:50%;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}

@media (max-width:600px){
  #main{padding:18px 14px 60px;}
  .card-body{padding:14px;}
  .form-grid{grid-template-columns:1fr;}
  .dp-grid2{grid-template-columns:1fr;}
  .dp-box-rows{grid-template-columns:1fr;}
}

/* ===== WEB / MÓVIL ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;}
html,body{background:#F6F7F9;}
#app{height:100dvh;}
@media (max-width:880px){
  .sidebar-toggle{display:none !important;}
  #sidebar{z-index:1500;}
  #sidebar.open::after{content:"";position:fixed;left:248px;top:0;right:0;bottom:0;background:rgba(0,0,0,.35);}
  .topbar{flex-wrap:wrap;gap:10px;}
  #topbarActions{width:100%;}
  #topbarActions .btn{flex:1 1 auto;}
  .modal-overlay{padding:8px !important;align-items:flex-end !important;}
  .modal{max-height:94dvh;overflow:hidden;display:flex;flex-direction:column;border-radius:14px 14px 10px 10px;}
  .modal-body{max-height:none;flex:1;overflow-y:auto;padding:16px;}
  .modal-head,.modal-foot{padding:12px 16px;}
  .modal-foot{flex-wrap:wrap;}
  .modal-foot .btn{flex:1 1 auto;}
  input,select,textarea{font-size:16px !important;}
  .table-wrap{-webkit-overflow-scrolling:touch;}
  #footerbar{flex-direction:column;gap:2px;text-align:center;}
}
/* ===== PANTALLA DE CLAVE ===== */
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#00235f,#092664 60%,#0b3a8f);display:flex;align-items:center;justify-content:center;padding:20px;}
#gate .box{background:#fff;border-radius:14px;padding:30px 26px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(16,35,61,.3);text-align:center;}
#gate .mark{width:52px;height:52px;border-radius:12px;background:#00235f;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:18px;}
#gate h2{font-family:var(--font-display);margin:0 0 4px;color:#00235f;font-size:22px;}
#gate p{margin:0 0 18px;color:#5B6674;font-size:13px;}
#gate input{width:100%;padding:12px 14px;border:1px solid #C3CBD6;border-radius:10px;font-size:16px;margin-bottom:10px;}
#gate button{width:100%;padding:12px;border:0;border-radius:10px;background:#00235f;color:#fff;font-weight:600;font-size:15px;cursor:pointer;}
#gate .err{color:#DC2626;font-size:13px;min-height:18px;margin-top:8px;}
body.locked #app{visibility:hidden;}

<style id="ui-theme">
/* TEMA EJECUTIVO FINTELLIX — solo interfaz; no afecta plantillas PDF */
#app,#modalRoot,.toast-wrap,#gate{--primary:#0B4AE0;--primary-hover:#0837B0;--primary-light:#EEF3FE;--ink:#0B1B3F;--ink-2:#0B1B3F;--gold:#0B4AE0;--gold-deep:#0837B0;--paper:#F3F5F9;--line:#E3E7EE;--line-strong:#CBD2DE;--text:#141B2D;--text-dim:#566073;--info:#0B4AE0;--font-display:'Montserrat','Inter',sans-serif;}
#modalRoot .doc-print{--font-display:'Source Serif 4',Georgia,serif;}
#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));}
#app #sidebar{background:#fff;color:var(--text);border-right:1px solid var(--line);}
#app .brand{padding:20px 18px 16px;border-bottom:1px solid var(--line);gap:11px;}
.brand-logo{width:40px;height:40px;object-fit:contain;flex:none;}
#sidebar:not(.collapsed) .brand-text{display:block;}
.brand-text small{display:none !important;}
#app .menu-toggle{display:none;}
.brand-text b{display:block;font:800 17px/1.1 'Montserrat',sans-serif;letter-spacing:.7px;color:#0A0A0A;}
.brand-text span{display:block;font:600 8.6px/1 'Montserrat',sans-serif;letter-spacing:2.1px;color:#0B4AE0;margin-top:5px;}
#app .company-chip{background:#F6F8FC;border-color:var(--line);}
#app .company-chip .ph{background:#DDE4F2;}
#app .company-chip-text .cr{color:#6B7689;}
#app .nav-group{border-top-color:var(--line);}
#app .nav-label{color:#8A94A6;}
#app .nav-item{color:#3B4558;border-radius:8px;padding:10px 12px;}
#app .nav-item .ic{opacity:1;}
#app .nav-item:hover{background:#F1F4FA;color:#0B1B3F;}
#app .nav-item.active{background:#EAF0FE;color:#0B4AE0;font-weight:600;box-shadow:inset 3px 0 0 #0B4AE0;}
#app .sidebar-toggle{background:#fff;border-color:var(--line-strong);color:#0B4AE0;box-shadow:0 2px 8px rgba(16,35,61,.14);}
#app #main{background:var(--paper);}
#app .topbar-left h1{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.2px;}
#app .topbar-left .sub{color:#6B7689;}
#app .card,#modalRoot .card{border-color:var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(16,35,61,.06);}
#app .card:hover{box-shadow:0 4px 14px rgba(16,35,61,.08);}
#app .card-head{background:#fff;}
#app .card-head h2{font-size:16px;font-weight:700;color:var(--ink);}
#app .stat-card{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 1px 3px rgba(16,35,61,.06);}
#app .stat-card::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:#0B4AE0;}
#app .stat-card .n{font-weight:700;font-size:25px;color:var(--ink);}
#app .stat-card .l{font-weight:600;font-size:11px;letter-spacing:.6px;}
#app .table-wrap{border-color:var(--line);border-radius:10px;}
#app table.tbl th{background:#F3F6FB;color:#4A5568;font-size:10.5px;letter-spacing:1px;}
#app table.tbl tbody tr:nth-child(even){background:#FAFBFD;}
#app .btn,#modalRoot .btn{border-radius:8px;border-color:var(--line-strong);color:#1F2937;}
#app .btn-primary,#modalRoot .btn-primary,#app .btn-gold,#modalRoot .btn-gold{background:#0B4AE0;border-color:#0B4AE0;color:#fff;}
#app .btn-primary:hover,#modalRoot .btn-primary:hover,#app .btn-gold:hover,#modalRoot .btn-gold:hover{background:#0837B0;border-color:#0837B0;color:#fff;}
#modalRoot .modal-overlay{background:rgba(11,27,63,.5);}
#modalRoot .modal{border-radius:14px;}
#modalRoot .modal-head h3{font-size:16px;font-weight:700;color:var(--ink);}
#app #footerbar{background:#fff;color:#7A8497;border-top:1px solid var(--line);font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.2px;text-transform:none;padding:9px 24px;}
#app #footerbar b{color:#0B4AE0;}
#gate{background:radial-gradient(circle at 20% 10%,#EAF0FE,#F3F5F9 55%,#E8ECF3);}
#gate .box{max-width:360px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(11,27,63,.12);padding:30px 28px 26px;}
#gate img{width:150px;height:auto;display:block;margin:0 auto 12px;}
#gate h2{font-size:16px;font-weight:700;letter-spacing:.2px;color:#0B1B3F;}
#gate input:focus{outline:none;border-color:#0B4AE0;box-shadow:0 0 0 4px rgba(11,74,224,.14);}
#gate button{background:#0B4AE0;font-family:'Montserrat',sans-serif;}
@media (max-width:880px){
  #app{grid-template-rows:1fr auto;}
  #app #sidebar:not(.open){box-shadow:none;}
  #app .menu-toggle{display:inline-flex;position:fixed;top:12px;left:12px;z-index:90;width:42px;height:42px;margin:0;background:#fff;border:1px solid var(--line-strong);color:#0B4AE0;border-radius:10px;box-shadow:0 2px 8px rgba(16,35,61,.15);}
  #app #main{padding:12px 14px 40px;}
  #app .topbar{margin-bottom:14px;}
  #app .topbar-left{min-height:42px;padding-left:54px;align-items:center;}
  #app .topbar-left h1{font-size:19px;margin:0;}
  #app .topbar-left .sub{font-size:12px;}
  #app .stats-grid{grid-template-columns:1fr 1fr;gap:10px;}
  #app .stat-card{padding:12px 14px;}
  #app .stat-card .n{font-size:21px;}
  #app .stat-card .l{font-size:10px;letter-spacing:.4px;}
  #app #footerbar{padding:7px 14px;justify-content:center;}
  #app #footerbar span:first-child{display:none;}
  #app #sidebar{z-index:1500;}
  #sidebar.open{box-shadow:0 0 0 100vmax rgba(11,27,63,.45);}
  #sidebar.open::after{display:none;}
}
</style>

/* ============================================================
   FINTELLIX ONE — NÚCLEO DE LA APLICACIÓN
   Arquitectura: State + Storage(localStorage, IndexedDB-ready) + Router simple + Módulos
   ============================================================ */

/* ---------- Utilidades ---------- */
const Util = {
  uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); },
  esc(str){
    if(str===undefined || str===null) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  money(n){
    n = Number(n)||0;
    return n.toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});
  },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  addDays(iso, days){
    const d = new Date(iso+'T00:00:00');
    d.setDate(d.getDate()+Number(days||0));
    return d.toISOString().slice(0,10);
  },
  fmtDate(iso){
    if(!iso) return '—';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  },
  debounce(fn, wait){
    let t;
    return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); };
  },
  pad(n, len){ return String(n).padStart(len,'0'); },
  /* Convierte un número entero (0 a 999.999.999) a su representación
     en letras, en español. Se usa para el detalle "Valor en letras"
     de los documentos, como es costumbre en la facturación ecuatoriana. */
  numeroALetras(num){
    num = Math.floor(Math.abs(Number(num)||0));
    if(num === 0) return 'CERO';
    const UNIDADES = ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ',
      'ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE'];
    const DECENAS = ['','','VEINTI','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
    const CENTENAS = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];

    function tresDigitos(n){
      n = Number(n);
      if(n === 0) return '';
      if(n === 100) return 'CIEN';
      const c = Math.floor(n/100), dec2 = n%100, d = Math.floor(dec2/10), u = dec2%10;
      let out = '';
      if(c > 0) out += CENTENAS[c] + ' ';
      if(dec2 <= 20){
        out += UNIDADES[dec2];
      }else if(d === 2){
        out += 'VEINTI' + UNIDADES[u];
      }else{
        out += DECENAS[d];
        if(u > 0) out += ' Y ' + UNIDADES[u];
      }
      return out.trim();
    }

    const millones = Math.floor(num / 1000000);
    const miles = Math.floor((num % 1000000) / 1000);
    const resto = num % 1000;

    const parts = [];
    if(millones > 0) parts.push(millones === 1 ? 'UN MILLÓN' : tresDigitos(millones) + ' MILLONES');
    if(miles > 0) parts.push(miles === 1 ? 'MIL' : tresDigitos(miles) + ' MIL');
    if(resto > 0) parts.push(tresDigitos(resto));
    return parts.join(' ').replace(/\s+/g,' ').trim();
  },
  /* Valor total expresado en letras + fracción numérica, en el formato
     habitual de comprobantes en Ecuador: "... CON 00/100 DÓLARES ..." */
  montoEnLetras(n){
    n = Number(n) || 0;
    const entero = Math.floor(n);
    const centavos = Math.round((n - entero) * 100);
    const letras = entero === 0 ? 'CERO' : Util.numeroALetras(entero);
    return `${letras} CON ${Util.pad(centavos,2)}/100 DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA`;
  }
};

/* ============================================================
   CAPA DE PERSISTENCIA
   Hoy: localStorage (síncrono, simple, cero dependencias).
   Preparado para migrar a IndexedDB o a un backend remoto:
   todas las llamadas pasan por DB.* y devuelven/aceptan los
   mismos objetos, por lo que reemplazar la implementación
   interna no debería requerir tocar los módulos.
   ============================================================ */
const DB = (function(){
  /* ------------------------------------------------------------
     Espacio de almacenamiento aislado por copia del archivo.
     Cada archivo HTML (identificado por su ruta/URL exacta) recibe
     un espacio de datos propio en localStorage. Así, si este HTML
     se copia y pega para crear otra instancia (otra empresa, otro
     equipo, otra carpeta), sus datos NUNCA se mezclan con los de
     esta copia: cada archivo "vive" con su propia información.
     ------------------------------------------------------------ */
  const NS = (function(){
    try{
      const seed = 'FINTELLIX_ONE_WEB_V1';
      let hash = 0;
      for(let i=0;i<seed.length;i++){ hash = ((hash<<5)-hash) + seed.charCodeAt(i); hash |= 0; }
      return 'F1_' + Math.abs(hash).toString(36) + '_';
    }catch(e){
      return 'F1_DEFAULT_';
    }
  })();

  function readRaw(key, fallback){
    try{
      const v = localStorage.getItem(NS+key);
      return v ? JSON.parse(v) : fallback;
    }catch(e){
      console.error('DB read error', key, e);
      return fallback;
    }
  }
  function writeRaw(key, value){
    try{
      localStorage.setItem(NS+key, JSON.stringify(value));
      return true;
    }catch(e){
      console.error('DB write error', key, e);
      Toast.show('No se pudo guardar: almacenamiento lleno o no disponible.', 'err');
      return false;
    }
  }

  const COLLECTIONS = [
    'clientes','proveedores','productosCompra','productosVenta',
    'vendedores','transportistas','proformas','ordenesCompra','guiasRemision'
  ];

  function all(col){ return readRaw(col, []); }
  function saveAll(col, arr){ return writeRaw(col, arr); }
  function getById(col, id){ return all(col).find(r => r.id === id) || null; }
  function upsert(col, record){
    const arr = all(col);
    const idx = arr.findIndex(r => r.id === record.id);
    if(idx >= 0) arr[idx] = record; else arr.push(record);
    saveAll(col, arr);
    if(typeof Sync!=='undefined') Sync.rec(col, record);
    return record;
  }
  function remove(col, id){
    const arr = all(col).filter(r => r.id !== id);
    saveAll(col, arr);
    if(typeof Sync!=='undefined') Sync.del(col, id);
  }

  function empresa(){ return readRaw('empresa', {}); }
  function saveEmpresa(obj){ const r = writeRaw('empresa', obj); if(typeof Sync!=='undefined') Sync.kv('empresa', obj); return r; }

  function nextSequence(docType, prefix){
    const seqs = readRaw('secuencias', {});
    const current = seqs[docType] || 0;
    const next = current + 1;
    seqs[docType] = next;
    writeRaw('secuencias', seqs); if(typeof Sync!=='undefined') Sync.kv('secuencias', seqs);
    return `${prefix}-${Util.pad(next, 9)}`;
  }

  function getSequences(){ return readRaw('secuencias', {}); }
  function setNextSequence(docType, nextNumber){
    const seqs = readRaw('secuencias', {});
    seqs[docType] = Math.max(0, Number(nextNumber||1) - 1);
    writeRaw('secuencias', seqs); if(typeof Sync!=='undefined') Sync.kv('secuencias', seqs);
  }

  function exportBackup(){
    const dump = { empresa: empresa(), secuencias: readRaw('secuencias', {}) };
    COLLECTIONS.forEach(c => dump[c] = all(c));
    return dump;
  }
  function importBackup(dump){
    if(!dump || typeof dump !== 'object') return false;
    if(dump.empresa) saveEmpresa(dump.empresa);
    if(dump.secuencias){ writeRaw('secuencias', dump.secuencias); if(typeof Sync!=='undefined') Sync.kv('secuencias', dump.secuencias); }
    COLLECTIONS.forEach(c => { if(Array.isArray(dump[c])){ saveAll(c, dump[c]); if(typeof Sync!=='undefined') dump[c].forEach(r=>Sync.rec(c, r)); } });
    return true;
  }

  function seedIfEmpty(){
    if(readRaw('__seeded', false)) return;
    COLLECTIONS.forEach(c => { if(!localStorage.getItem(NS+c)) saveAll(c, []); });
    if(!localStorage.getItem(NS+'secuencias')) writeRaw('secuencias', {});
    if(!localStorage.getItem(NS+'empresa')) writeRaw('empresa', {});
    writeRaw('__seeded', true);
  }

  /* Borra ÚNICAMENTE los datos guardados por esta copia del archivo
     (su propio espacio de nombres). No toca otras copias del HTML
     ni ningún otro dato del navegador. */
  function wipeAll(){
    try{
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(NS) === 0) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      return true;
    }catch(e){
      console.error('DB wipe error', e);
      return false;
    }
  }

  return { _w: writeRaw, all, saveAll, getById, upsert, remove, empresa, saveEmpresa, nextSequence, getSequences, setNextSequence, exportBackup, importBackup, seedIfEmpty, wipeAll, COLLECTIONS };
})();

/* ============================================================
   AUTOCOMPLETADO REUTILIZABLE
   ============================================================ */
const Autocomplete = {
  attach({ inputEl, listEl, fetchFn, renderItemFn, onSelect, minChars=1 }){
    let items = [];
    let hi = -1;

    function renderList(){
      if(items.length === 0){
        listEl.innerHTML = `<div class="ac-empty">Sin resultados</div>`;
      }else{
        listEl.innerHTML = items.map((it,i)=> `<div class="ac-item ${i===hi?'hi':''}" data-idx="${i}">${renderItemFn(it)}</div>`).join('');
      }
      listEl.style.display = 'block';
    }
    function hide(){ listEl.style.display = 'none'; listEl.innerHTML=''; hi=-1; }

    inputEl.addEventListener('input', Util.debounce(()=>{
      const q = inputEl.value.trim();
      if(q.length < minChars){ hide(); return; }
      items = fetchFn(q);
      hi = -1;
      renderList();
    }, 140));

    inputEl.addEventListener('keydown', (e)=>{
      if(listEl.style.display !== 'block') return;
      if(e.key === 'ArrowDown'){ e.preventDefault(); hi = Math.min(hi+1, items.length-1); renderList(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); hi = Math.max(hi-1, 0); renderList(); }
      else if(e.key === 'Enter'){ if(hi>=0 && items[hi]){ e.preventDefault(); onSelect(items[hi]); hide(); } }
      else if(e.key === 'Escape'){ hide(); }
    });
    listEl.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.ac-item');
      if(!item) return;
      const idx = Number(item.dataset.idx);
      onSelect(items[idx]);
      hide();
    });
    inputEl.addEventListener('blur', ()=> setTimeout(hide, 150));
    inputEl.addEventListener('focus', ()=>{ if(inputEl.value.trim().length>=minChars){ items = fetchFn(inputEl.value.trim()); renderList(); } });
  }
};

function ContactCatalog(col, singular, plural, icon){
  const FIELDS = [
    {k:'tipoIdentificacion', label:'Tipo de identificación', type:'select', options:['RUC','Cédula','Pasaporte'], req:true},
    {k:'identificacion', label:'Número de identificación', type:'text', req:true},

    {k:'nombreComercial', label:'Nombre comercial', type:'text'},
    {k:'direccion', label:'Dirección', type:'text', full:true},
    {k:'ciudad', label:'Ciudad', type:'text'},
    {k:'provincia', label:'Provincia', type:'text'},
    {k:'telefono', label:'Teléfono', type:'text'},
    {k:'correo', label:'Correo', type:'email'},
    {k:'estado', label:'Estado', type:'select', options:['activo','inactivo'], req:true, def:'activo'}
  ];

  function render(searchTerm){
    searchTerm = (searchTerm||'').toLowerCase();
    const items = DB.all(col).filter(r =>
      !searchTerm ||
      (r.razonSocial||'').toLowerCase().includes(searchTerm) ||
      (r.nombreComercial||'').toLowerCase().includes(searchTerm) ||
      (r.identificacion||'').toLowerCase().includes(searchTerm) ||

    ).sort((a,b)=> (a.razonSocial||'').localeCompare(b.razonSocial||''));

    return `
      <div class="card">

            <div class="search-box">

              <input type="text" id="catSearch" placeholder="Buscar por nombre, RUC o teléfono..." value="${Util.esc(searchTerm)}">

        </div>
        <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Razón social</th><th>Identificación</th><th>Contacto</th><th>Ciudad</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            ${items.length === 0 ? `<tr class="empty-row"><td colspan="6">No hay ${plural.toLowerCase()} registrados${searchTerm?' para esa búsqueda':''}.</td></tr>` :
              items.map(r => `
              <tr>
                <td><strong>${Util.esc(r.razonSocial)}</strong>${r.nombreComercial?`<div style="color:var(--text-dim);font-size:12px;">${Util.esc(r.nombreComercial)}</div>`:''}</td>
                <td class="num">${Util.esc(r.tipoIdentificacion)} ${Util.esc(r.identificacion)}</td>
                <td>${Util.esc(r.telefono)||'—'}<div style="color:var(--text-dim);font-size:12px;">${Util.esc(r.correo)||''}</div></td>
                <td>${Util.esc(r.ciudad)||'—'}</td>
                <td><span class="badge ${r.estado==='activo'?'badge-green':'badge-gray'}">${r.estado}</span></td>
                <td style="text-align:right;white-space:nowrap;">
                  <button class="btn btn-sm btn-ghost" data-action="cat-edit" data-id="${r.id}">Editar</button>
                  <button class="btn btn-sm btn-ghost" data-action="cat-delete" data-id="${r.id}">Eliminar</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>`;
  }

  function formHtml(record){
    record = record || {};
    return `<div class="form-grid">
      ${FIELDS.map(f => {
        const val = record[f.k] !== undefined ? record[f.k] : (f.def||'');
        if(f.type === 'select'){
          return `<div class="field ${f.full?'full':''}"><label>${f.label}${f.req?' *':''}</label>
            <select data-f="${f.k}">${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o.charAt(0).toUpperCase()+o.slice(1)}</option>`).join('')}</select></div>`;
        }
        return `<div class="field ${f.full?'full':''}"><label>${f.label}${f.req?' *':''}</label>
          <input type="${f.type}" data-f="${f.k}" value="${Util.esc(val)}"></div>`;
      }).join('')}
    </div>`;
  }

  function openForm(id, onSaved, prefillRecord){
    const record = id ? DB.getById(col, id) : null;
    const initial = record || prefillRecord || null;
    Modal.open({
      title: record ? `Editar ${singular}` : `Nuevo ${singular}`,
      bodyHtml: formHtml(initial),
      footHtml: `<button class="btn" data-action="modal-close">Cancelar</button>
                 <button class="btn btn-primary" id="catSaveBtn">Guardar</button>`,
      onMount(){
        document.getElementById('catSaveBtn').addEventListener('click', ()=>{
          const data = record ? {...record} : {id: Util.uid()};
          let valid = true;
          FIELDS.forEach(f=>{
            const el = document.querySelector(`[data-f="${f.k}"]`);
            const v = el.value.trim();
            if(f.req && !v) valid = false;
            data[f.k] = v;
          });
          if(!valid){ Toast.show('Complete los campos obligatorios (*)', 'err'); return; }
          DB.upsert(col, data);
          Toast.show(`${singular} guardado correctamente`, 'ok');
          Modal.close();
          if(onSaved) onSaved(data); else App.renderView();
        });
      }
    });
  }

  function bindEvents(container){
    const searchInput = container.querySelector('#catSearch');
    if(searchInput){
      searchInput.addEventListener('input', Util.debounce(()=>{
        App.state.catalogSearch = searchInput.value;
        const html = render(searchInput.value);
        container.innerHTML = html;
        bindEvents(container);
        container.querySelector('#catSearch').focus();
        container.querySelector('#catSearch').selectionStart = container.querySelector('#catSearch').value.length;
      }, 180));
    }
    container.querySelectorAll('[data-action="cat-new"]').forEach(b=>b.addEventListener('click', ()=>openForm(null)));
    container.querySelectorAll('[data-action="cat-edit"]').forEach(b=>b.addEventListener('click', ()=>openForm(b.dataset.id)));
    container.querySelectorAll('[data-action="cat-delete"]').forEach(b=>b.addEventListener('click', ()=>{
      Modal.confirmDelete(`¿Eliminar este ${singular.toLowerCase()}? Esta acción no se puede deshacer.`, ()=>{
        DB.remove(col, b.dataset.id);
        Toast.show(`${singular} eliminado`, 'ok');
        App.renderView();
      });
    }));
  }

  return {
    mount(root){
      root.innerHTML = render('');
      bindEvents(root);
    },
    openForm
  };
}

  return { mount(root){ root.innerHTML = render(''); bindEvents(root); }, openForm };
}

        const stamp = new Date().toISOString().slice(0,10);
        WebIO.save(`fintellix-one-backup-${stamp}.json`, blob);
      }catch(e){
        console.error(e);
        Toast.show('No se pudo generar la copia de seguridad', 'err');
      }
    });

    const importInput = document.getElementById('importBackupFile');
    document.getElementById('importBackupBtn').addEventListener('click', ()=> importInput.click());
    importInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        let dump;
        try{ dump = JSON.parse(reader.result); }
        catch(err){ Toast.show('El archivo seleccionado no es una copia de seguridad válida', 'err'); importInput.value=''; return; }

        Modal.confirmAction({
          title: 'Confirmar importación',
          msg: 'Esto reemplazará TODOS los datos actuales de esta copia (empresa, catálogos y documentos) con los del archivo seleccionado. Úselo solo para traer la información de una versión anterior. Esta acción no se puede deshacer.',
          confirmLabel: 'Importar y reemplazar',
          onConfirm: ()=>{
            if(DB.importBackup(dump)){
              Toast.show('Datos importados correctamente', 'ok');
              App.refreshCompanyChip();
              App.navigate('dashboard');
            }else{
              Toast.show('El archivo no tiene un formato reconocido', 'err');
            }
            importInput.value = '';
          },
          onCancel: ()=>{ importInput.value = ''; }
        });
      };
      reader.readAsText(file);
    });

    document.getElementById('wipeDataBtn').addEventListener('click', ()=>{
      Modal.confirmDelete(
        'Se eliminarán permanentemente todos los datos guardados en esta copia del archivo (empresa, catálogos y documentos). Esta acción no se puede deshacer y no afecta a otras copias de este HTML.',
        ()=>{
          if(DB.wipeAll()){
            Toast.show('Todos los datos de esta copia fueron eliminados', 'ok');
            DB.seedIfEmpty();
            App.refreshCompanyChip();
            App.navigate('dashboard');
          }
        }
      );
    });
  }
};

/* ============================================================
   MOTOR DE DOCUMENTOS (base para Proformas / OC / Guías)
   Encapsula: numeración, líneas de producto, cálculo de totales,
   listado + búsqueda, y generación de plantilla de impresión.
   ============================================================ */
function DocumentEngine(config){
  // config: { col, docType, prefix, singular, plural, partyRole ('cliente'|'proveedor'),
  //           partySearchFn, productSearchFn, priceField, hasIVA, hasCosts, lineExtra }
  let draft = null; // documento en edición (objeto)

  function blankDoc(){
    const today = Util.todayISO();
    return {
      id: Util.uid(),
      numero: null, // se asigna al guardar por primera vez
      fecha: today,
      vencimiento: Util.addDays(today, 8),
      formaPago: 'Contado',
      partyId: null,
      partySnapshot: {},
      vendedorId: null,
      vendedorSnapshot: {},
      sinVendedor: false,
      observaciones: '',
      items: [ { productoId:null, codigo:'', _label:'', cantidad:1, unidad:'', precio:0, descuento:0, iva: config.hasIVA?'15':'0' } ],
      estado: 'borrador',
      creadoEn: new Date().toISOString(),
      // campos específicos de Guías de Remisión
      transportistaId: null, transportistaSnapshot: {},
      transportista:'', vehiculo:'', placa:'', puntoPartida:'', puntoLlegada:'', motivoTraslado:'',
      fechaInicioTraslado: today, fechaFinTraslado: today,
      documentoAduanero:'', codigoEstablecimientoDestino:'', ruta:''
    };
  }

  function computeTotals(doc){
    let subtotal = 0, descuentoTotal = 0, ivaTotal = 0;
    doc.items.forEach(it=>{
      const bruto = (Number(it.cantidad)||0) * (Number(it.precio)||0);
      const desc = bruto * ((Number(it.descuento)||0)/100);
      const neto = bruto - desc;
      const iva = config.hasIVA ? neto * ((Number(it.iva)||0)/100) : 0;
      subtotal += neto;
      descuentoTotal += desc;
      ivaTotal += iva;
    });
    return { subtotal, descuentoTotal, ivaTotal, total: subtotal + ivaTotal };
  }

  /* ---------- LISTADO ---------- */
  function renderList(searchTerm){
    searchTerm = (searchTerm||'').toLowerCase();
    const docs = DB.all(config.col).filter(d =>
      !searchTerm ||
      (d.numero||'').toLowerCase().includes(searchTerm) ||
      (d.partySnapshot?.razonSocial||'').toLowerCase().includes(searchTerm) ||
      (d.partySnapshot?.identificacion||'').toLowerCase().includes(searchTerm)
    ).sort((a,b)=> (b.numero||'').localeCompare(a.numero||''));

    const partyLabel = config.partyRole === 'proveedor' ? 'Proveedor' : 'Cliente';

    return `
      <div class="card">
        <div class="card-head">
          <h2>${config.plural}</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="docSearch" placeholder="Buscar por número, ${partyLabel.toLowerCase()} o identificación..." value="${Util.esc(searchTerm)}">
            </div>
            <button class="btn btn-primary" data-action="doc-new">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nuevo
            </button>
          </div>
        </div>
        <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Número</th><th>Fecha</th><th>${partyLabel}</th><th>Total</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            ${docs.length === 0 ? `<tr class="empty-row"><td colspan="6">No hay documentos registrados${searchTerm?' para esa búsqueda':''}.</td></tr>` :
              docs.map(d=>{
                const t = computeTotals(d);
                return `<tr>
                  <td class="doc-num">${Util.esc(d.numero||'BORRADOR')}</td>
                  <td>${Util.fmtDate(d.fecha)}</td>
                  <td><strong>${Util.esc(d.partySnapshot?.razonSocial)||'—'}</strong></td>
                  <td class="num">$${Util.money(t.total)}</td>
                  <td><span class="badge ${d.estado==='anulado'?'badge-red':d.estado==='emitido'?'badge-green':'badge-gray'}">${d.estado}</span></td>
                  <td style="text-align:right;white-space:nowrap;">
                    <button class="btn btn-sm btn-ghost" data-action="doc-edit" data-id="${d.id}">Editar</button>
                    <button class="btn btn-sm btn-ghost" data-action="doc-dup" data-id="${d.id}">Duplicar</button>
                    <button class="btn btn-sm btn-ghost" data-action="doc-print" data-id="${d.id}">PDF</button>
                    <button class="btn btn-sm btn-ghost" data-action="doc-download" data-id="${d.id}">Descargar</button>
                    <button class="btn btn-sm btn-ghost" data-action="doc-delete" data-id="${d.id}">Eliminar</button>
                  </td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
        </div>
      </div>`;
  }

  /* ---------- LÍNEAS DE PRODUCTO ---------- */
  function lineRowHtml(item, idx){
    if(config.simpleItems){
      return `<tr data-idx="${idx}">
        <td style="width:110px;"><input type="text" class="li-codigo" value="${Util.esc(item.codigo)}" readonly tabindex="-1" placeholder="—"></td>
        <td style="min-width:220px;">
          <div style="display:flex;gap:6px;">
            <div class="ac-wrap" style="flex:1;position:relative;">
              <input type="text" class="li-prod-search" placeholder="Buscar producto por código o nombre..." value="${Util.esc(item._label||'')}">
              <div class="ac-list" style="display:none;"></div>
            </div>
            <button type="button" class="btn btn-sm li-new-prod" data-idx="${idx}" title="Crear producto nuevo">+ Nuevo</button>
          </div>
        </td>
        <td style="width:100px;"><input type="number" min="0" step="1" class="num-in li-cant" value="${item.cantidad}"></td>
        <td style="width:96px;"><input type="text" class="li-unidad-in" list="unidadesList" maxlength="14" placeholder="UND" value="${Util.esc(item.unidad)}" style="text-align:center;text-transform:uppercase;"></td>
        <td style="width:36px;"><button type="button" class="li-remove" data-idx="${idx}" title="Quitar línea">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        </button></td>
      </tr>`;
    }
    return `<tr data-idx="${idx}">
      <td style="min-width:230px;">
        <div style="display:flex;gap:6px;">
          <div class="ac-wrap" style="flex:1;position:relative;">
            <input type="text" class="li-prod-search" placeholder="Buscar producto por código o nombre..." value="${Util.esc(item._label||'')}">
            <div class="ac-list" style="display:none;"></div>
          </div>
          <button type="button" class="btn btn-sm li-new-prod" data-idx="${idx}" title="Crear producto nuevo">+ Nuevo</button>
        </div>
      </td>
      <td style="width:80px;"><input type="number" min="0" step="1" class="num-in li-cant" value="${item.cantidad}"></td>
      <td style="width:96px;"><input type="text" class="li-unidad-in" list="unidadesList" maxlength="14" placeholder="UND" value="${Util.esc(item.unidad)}" style="text-align:center;text-transform:uppercase;"></td>
      <td style="width:100px;"><input type="number" min="0" step="0.01" class="num-in li-precio" value="${item.precio}"></td>
      <td style="width:80px;"><input type="number" min="0" max="100" step="1" class="num-in li-desc" value="${item.descuento||0}"></td>
      ${config.hasIVA ? `<td style="width:74px;">
        <select class="li-iva">
          <option value="0" ${String(item.iva)==='0'?'selected':''}>0%</option>
          <option value="5" ${String(item.iva)==='5'?'selected':''}>5%</option>
          <option value="15" ${String(item.iva)==='15'?'selected':''}>15%</option>
        </select></td>` : ''}
      <td style="width:100px;" class="num li-subtotal">$0.00</td>
      <td style="width:36px;"><button type="button" class="li-remove" data-idx="${idx}" title="Quitar línea">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
      </button></td>
    </tr>`;
  }

  function itemsTableHtml(){
    if(config.simpleItems){
      return `<table class="li-table" id="itemsTable">
        <thead><tr><th>Código</th><th>Producto</th><th>Cant.</th><th>Unidad</th><th></th></tr></thead>
        <tbody id="itemsBody">
          ${draft.items.map((it,i)=>lineRowHtml(it,i)).join('')}
        </tbody>
      </table>
      <button type="button" class="btn btn-sm" id="addLineBtn" style="margin-top:10px;">+ Agregar producto</button>`;
    }
    return `<table class="li-table" id="itemsTable">
      <thead><tr>
        <th>Producto</th><th>Cant.</th><th>Unidad</th><th>${config.hasCosts?'Costo':'Precio'}</th><th>Desc. %</th>${config.hasIVA?'<th>IVA</th>':''}<th>Subtotal</th><th></th>
      </tr></thead>
      <tbody id="itemsBody">
        ${draft.items.map((it,i)=>lineRowHtml(it,i)).join('')}
      </tbody>
    </table>
    <button type="button" class="btn btn-sm" id="addLineBtn" style="margin-top:10px;">+ Agregar producto</button>`;
  }

  function totalsHtml(){
    const t = computeTotals(draft);
    return `<div class="totals-box">
      <div class="totals-row"><span class="lbl">Subtotal</span><span class="val">$${Util.money(t.subtotal)}</span></div>
      <div class="totals-row"><span class="lbl">Descuento</span><span class="val">-$${Util.money(t.descuentoTotal)}</span></div>
      ${config.hasIVA ? `<div class="totals-row"><span class="lbl">IVA</span><span class="val">$${Util.money(t.ivaTotal)}</span></div>` : ''}
      <div class="totals-row grand"><span class="lbl">Total</span><span class="val">$${Util.money(t.total)}</span></div>
    </div>`;
  }

  function refreshItemsCalc(){
    if(config.simpleItems) return;
    draft.items.forEach((it,i)=>{
      const bruto = (Number(it.cantidad)||0)*(Number(it.precio)||0);
      const desc = bruto*((Number(it.descuento)||0)/100);
      const neto = bruto - desc;
      const row = document.querySelector(`#itemsBody tr[data-idx="${i}"] .li-subtotal`);
      if(row) row.textContent = '$'+Util.money(neto);
    });
    const box = document.querySelector('.totals-box');
    if(box) box.outerHTML = totalsHtml();
  }

  function bindItemRow(idx){
    const row = document.querySelector(`#itemsBody tr[data-idx="${idx}"]`);
    if(!row) return;
    const searchInput = row.querySelector('.li-prod-search');
    const listEl = row.querySelector('.ac-list');
    const unitIn = row.querySelector('.li-unidad-in');
    if(unitIn) unitIn.addEventListener('input', ()=>{ draft.items[idx].unidad = unitIn.value.trim().toUpperCase(); });
    const productCatalogModule = config.partyRole === 'proveedor' ? ProductosCompraModule : ProductosVentaModule;
    const fetchFn = config.partyRole === 'proveedor' ? searchProductosCompra : searchProductosVenta;

    function applyProduct(p){
      draft.items[idx].productoId = p.id;
      draft.items[idx].codigo = p.codigo;
      draft.items[idx]._label = `${p.codigo} — ${p.nombre}`;
      draft.items[idx].precio = p.precio || 0;
      draft.items[idx].unidad = p.unidad || 'UND';
      draft.items[idx].iva = config.hasIVA ? (p.iva ?? '15') : '0';
      searchInput.value = draft.items[idx]._label;
      if(!config.simpleItems){
        row.querySelector('.li-precio').value = draft.items[idx].precio;
        if(config.hasIVA) row.querySelector('.li-iva').value = String(p.iva ?? '15');
      }
      const uEl = row.querySelector('.li-unidad-in');
      if(uEl) uEl.value = draft.items[idx].unidad || 'UND';
      refreshItemsCalc();
    }

    Autocomplete.attach({
      inputEl: searchInput, listEl,
      fetchFn: (q)=> fetchFn(q),
      renderItemFn: (p)=> `<div class="t1">${Util.esc(p.nombre)}</div><div class="t2">${Util.esc(p.codigo)} · $${Util.money(p.precio)}</div>`,
      onSelect: applyProduct
    });

    row.querySelector('.li-new-prod').addEventListener('click', ()=>{
      const typed = searchInput.value.trim();
      productCatalogModule.openForm(null, (record)=>{ applyProduct(record); }, typed ? {nombre: typed} : null);
    });

    row.querySelector('.li-cant').addEventListener('input', (e)=>{ draft.items[idx].cantidad = e.target.value; refreshItemsCalc(); });
    if(!config.simpleItems){
      row.querySelector('.li-precio').addEventListener('input', (e)=>{ draft.items[idx].precio = e.target.value; refreshItemsCalc(); });
      row.querySelector('.li-desc').addEventListener('input', (e)=>{ draft.items[idx].descuento = e.target.value; refreshItemsCalc(); });
      const ivaSel = row.querySelector('.li-iva');
      if(ivaSel) ivaSel.addEventListener('change', (e)=>{ draft.items[idx].iva = e.target.value; refreshItemsCalc(); });
    }
    row.querySelector('.li-remove').addEventListener('click', ()=>{
      draft.items.splice(idx,1);
      rerenderItems();
    });
  }

  function rerenderItems(){
    const wrap = document.getElementById('itemsTableWrap');
    wrap.innerHTML = itemsTableHtml();
    draft.items.forEach((_,i)=>bindItemRow(i));
    document.getElementById('addLineBtn').addEventListener('click', ()=>{
      draft.items.push({ productoId:null, codigo:'', _label:'', cantidad:1, unidad:'', precio:0, descuento:0, iva: config.hasIVA?'15':'0' });
      rerenderItems();
    });
    refreshItemsCalc();
  }

  /* ---------- FORMULARIO (vista completa) ---------- */
  function renderForm(){
    const partyLabel = config.partyRole === 'proveedor' ? 'Proveedor' : 'Cliente';
    const p = draft.partySnapshot || {};

    const extraFields = config.docType === 'GR' ? `

        <div class="field"><label>Punto de llegada</label><input type="text" id="f_puntoLlegada" value="${Util.esc(draft.puntoLlegada)}"></div>
        <div class="field full"><label>Motivo de traslado</label><input type="text" id="f_motivoTraslado" value="${Util.esc(draft.motivoTraslado)}" placeholder="Ej: Venta, traspaso entre bodegas, exportación..."></div>
        <div class="field"><label>Documento aduanero (opcional)</label><input type="text" id="f_documentoAduanero" value="${Util.esc(draft.documentoAduanero)}"></div>
        <div class="field"><label>Código establecimiento destino (opcional)</label><input type="text" id="f_codigoEstablecimientoDestino" value="${Util.esc(draft.codigoEstablecimientoDestino)}"></div>
        <div class="field"><label>Ruta (opcional)</label><input type="text" id="f_ruta" value="${Util.esc(draft.ruta)}"></div>
      </div>` : '';

    return `
      <div class="card">
        <div class="card-head">
          <div>
            <h2>${draft.numero ? 'Editar ' + config.singular.toLowerCase() : 'Nuevo ' + config.singular.toLowerCase()}</h2>
            <span class="badge ${draft.numero ? 'badge-green' : 'badge-gray'}" style="margin-top:6px;display:inline-block;">${draft.numero ? 'emitido' : 'borrador · sin guardar'}</span>
          </div>
          <div class="stamp"><span class="prefix">${config.singular}</span><span class="code">${draft.numero || config.prefix + '-PENDIENTE'}</span></div>
        </div>
        <div class="card-body">
          <div class="section-title">Datos generales</div>
          <div class="form-grid">
            <div class="field"><label>Fecha de emisión</label><input type="date" id="f_fecha" value="${draft.fecha}"></div>
            ${config.docType === 'PRF' ? `<div class="field"><label>Fecha de vencimiento</label><input type="date" id="f_vencimiento" value="${draft.vencimiento}"></div>` : ''}
            ${config.docType !== 'GR' ? `<div class="field"><label>Forma de pago</label>
              <select id="f_formaPago">
                ${['Contado','Crédito 15 días','Crédito 30 días','Crédito 60 días','Crédito 90 días'].map(o=>`<option value="${o}" ${draft.formaPago===o?'selected':''}>${o}</option>`).join('')}
              </select></div>` : ''}
          </div>
          ${config.docType === 'PRF' ? `
          <div class="divider"></div>
          <div class="section-title">Vendedor</div>
          <div class="form-grid">
            <div class="field full ac-wrap">
              <label>Buscar vendedor</label>
              <div style="display:flex;gap:8px;">
                <div style="flex:1;position:relative;">
                  <input type="text" id="vendedorSearch" placeholder="Escriba para buscar..." value="${Util.esc(draft.vendedorSnapshot?.nombre||'')}" ${draft.sinVendedor?'disabled':''}>
                  <div class="ac-list" id="vendedorAcList" style="display:none;"></div>
                </div>
                <button type="button" class="btn btn-sm" id="newVendedorBtn" ${draft.sinVendedor?'disabled':''}>+ Nuevo</button>

              <label style="display:flex;align-items:center;gap:7px;font-weight:500;text-transform:none;letter-spacing:0;margin-top:8px;font-size:13px;color:var(--text-dim);">

          <div class="divider"></div>
          <div class="section-title">${partyLabel}</div>
          <div class="form-grid">
            <div class="field full ac-wrap">
              <label>Buscar ${partyLabel.toLowerCase()} (nombre, RUC o teléfono)</label>
              <div style="display:flex;gap:8px;">
                <div style="flex:1;position:relative;">
                  <input type="text" id="partySearch" placeholder="Escriba para buscar..." value="${p.razonSocial ? p.razonSocial + ' — ' + p.identificacion : ''}">
                  <div class="ac-list" id="partyAcList" style="display:none;"></div>
                </div>
